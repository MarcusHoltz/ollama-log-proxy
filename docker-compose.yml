services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  proxy:
    build: .
    ports:
      - "11433:11433"
      - "8080:8080"
      - "9090:9090"
    environment:
      OLP_OLLAMA_URL: http://ollama:11434
      OLP_BACKEND: sqlite
      OLP_DB_PATH: /data/ollama-logs.db
    command: ["--dashboard", "8080", "--metrics-port", "9090"]
    volumes:
      - proxy_data:/data
    depends_on:
      - ollama

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - proxy

volumes:
  ollama_data:
  proxy_data:
  grafana_data:

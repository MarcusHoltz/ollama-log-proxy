[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-log-proxy"
version = "0.2.0"
description = "HTTP reverse proxy for Ollama that logs inference usage to a configurable backend."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Besher Hilal", email = "besher@thebash.dev" },
]
keywords = ["ollama", "proxy", "logging", "llm", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Internet :: Proxy Servers",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
ollama-log-proxy = "ollama_log_proxy.cli:main"

[project.urls]
Homepage = "https://github.com/The-Bash/ollama-log-proxy"
Repository = "https://github.com/The-Bash/ollama-log-proxy"
Issues = "https://github.com/The-Bash/ollama-log-proxy/issues"
Changelog = "https://github.com/The-Bash/ollama-log-proxy/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_log_proxy"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ollama_log_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

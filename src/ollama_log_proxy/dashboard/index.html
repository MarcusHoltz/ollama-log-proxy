<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Log Proxy — Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --text: #e4e4e7;
            --muted: #71717a;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --green: #22c55e;
            --orange: #f97316;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: 1.5rem; font-weight: 600; }
        h1 span { color: var(--accent-light); }
        .refresh-info { color: var(--muted); font-size: 0.85rem; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .stat-card .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
        .stat-card .value.accent { color: var(--accent-light); }
        .stat-card .value.green { color: var(--green); }
        .stat-card .value.orange { color: var(--orange); }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .chart-card h2 { font-size: 1rem; margin-bottom: 1rem; font-weight: 500; }
        .chart-card canvas { max-height: 300px; }
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .table-card h2 { font-size: 1rem; margin-bottom: 1rem; font-weight: 500; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
        td { font-variant-numeric: tabular-nums; }
        .empty { color: var(--muted); text-align: center; padding: 3rem; }
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ollama-log-proxy <span>dashboard</span></h1>
            <div class="refresh-info">Auto-refreshes every 30s</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Requests</div>
                <div class="value accent" id="total-requests">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Tokens</div>
                <div class="value green" id="total-tokens">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Models Used</div>
                <div class="value orange" id="model-count">0</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>Tokens by Model</h2>
                <canvas id="tokens-chart"></canvas>
            </div>
            <div class="chart-card">
                <h2>Requests by Model</h2>
                <canvas id="requests-chart"></canvas>
            </div>
        </div>

        <div class="table-card">
            <h2>Model Breakdown</h2>
            <table>
                <thead>
                    <tr>
                        <th>Model</th>
                        <th>Requests</th>
                        <th>Prompt Tokens</th>
                        <th>Completion Tokens</th>
                    </tr>
                </thead>
                <tbody id="model-table"></tbody>
            </table>
            <div class="empty" id="empty-state">No inference data yet. Start sending requests through the proxy.</div>
        </div>
    </div>

    <script>
        const COLORS = ['#6366f1','#22c55e','#f97316','#ec4899','#06b6d4','#eab308','#8b5cf6','#ef4444'];
        let tokensChart, requestsChart;

        function initCharts() {
            const defaults = Chart.defaults;
            defaults.color = '#71717a';
            defaults.borderColor = '#2a2d3a';

            tokensChart = new Chart(document.getElementById('tokens-chart'), {
                type: 'bar',
                data: { labels: [], datasets: [
                    { label: 'Prompt', data: [], backgroundColor: '#6366f1' },
                    { label: 'Completion', data: [], backgroundColor: '#22c55e' }
                ]},
                options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, grid: { color: '#2a2d3a' } }, x: { grid: { display: false } } } }
            });

            requestsChart = new Chart(document.getElementById('requests-chart'), {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: COLORS }] },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function formatNumber(n) {
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return n.toString();
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                updateDashboard(data);
            } catch (e) {
                console.error('Failed to fetch stats:', e);
            }
        }

        function updateDashboard(data) {
            document.getElementById('total-requests').textContent = formatNumber(data.total_requests || 0);
            document.getElementById('total-tokens').textContent = formatNumber(data.total_tokens || 0);

            const models = data.models || {};
            const modelNames = Object.keys(models);
            document.getElementById('model-count').textContent = modelNames.length;

            const emptyState = document.getElementById('empty-state');
            const tableBody = document.getElementById('model-table');

            if (modelNames.length === 0) {
                emptyState.style.display = 'block';
                tableBody.innerHTML = '';
            } else {
                emptyState.style.display = 'none';
                tableBody.innerHTML = modelNames.map(name => {
                    const m = models[name];
                    return `<tr><td>${name}</td><td>${m.requests || 0}</td><td>${formatNumber(m.prompt || 0)}</td><td>${formatNumber(m.completion || 0)}</td></tr>`;
                }).join('');
            }

            tokensChart.data.labels = modelNames;
            tokensChart.data.datasets[0].data = modelNames.map(n => models[n].prompt || 0);
            tokensChart.data.datasets[1].data = modelNames.map(n => models[n].completion || 0);
            tokensChart.update();

            requestsChart.data.labels = modelNames;
            requestsChart.data.datasets[0].data = modelNames.map(n => models[n].requests || 0);
            requestsChart.update();
        }

        initCharts();
        fetchStats();
        setInterval(fetchStats, 30000);
    </script>
</body>
</html>
